        .dropdown-item:hover {

        }

        /* 主要內容與按鈕區塊 */

        /* 頁尾區塊 */

        /* 手機版響應式 RWD 樣式 (螢幕小於 768px) */

    <!-- JavaScript互動與Discord驗證邏輯 -->
    <script>
        function toggleNavMenu() {
            const navMenu = document.getElementById('navMenu');
            navMenu.classList.toggle('show-nav');
        }

        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('show');
        }

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.user-menu-container') && !e.target.closest('.hamburger-btn') && !e.target.closest('nav')) {
                const menu = document.getElementById('dropdownMenu');
                if (menu.classList.contains('show')) {
                    menu.classList.remove('show');
                }
                const navMenu = document.getElementById('navMenu');
                if (navMenu.classList.contains('show-nav')) {
                    navMenu.classList.remove('show-nav');
                }
            }
        });

        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const accessToken = fragment.get('access_token');

        if (accessToken) {
            localStorage.setItem('discord_token', accessToken);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        const savedToken = localStorage.getItem('discord_token');

        if (savedToken) {
            fetch('https://discord.com/api/users/@me', {
                headers: {
                    authorization: `Bearer ${savedToken}`
                }
            })
            .then(response => {
                if (!response.ok) throw new Error('Token 失效');
                return response.json();
            })
            .then(data => {
                const userId = data.id;
                const avatarHash = data.avatar;
                const avatarUrl = avatarHash 
                    ? `https://cdn.discordapp.com/avatars/${userId}/${avatarHash}.png`
                    : 'https://cdn.discordapp.com/embed/avatars/0.png';

                document.getElementById('user-avatar-img').src = avatarUrl;

                document.getElementById('auth-action').innerHTML = `
                    <button onclick="logout()" class="dropdown-item" style="color: #ef4444; font-weight: bold;">登出帳號</button>
                `;
            })
            .catch(() => {
                localStorage.removeItem('discord_token');
            });
        }

        function logout() {
            localStorage.removeItem('discord_token');
            window.location.href = window.location.pathname;
        }
    </script>
