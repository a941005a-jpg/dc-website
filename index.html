<script>
    // 1. 抓取 Discord 網址列回傳的 Token
    const fragment = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = fragment.get('access_token');

    if (accessToken) {
        // 2. 如果有抓到 Token，去跟 Discord 官方要使用者資料
        fetch('https://discord.com/api/users/@me', {
            headers: {
                authorization: `Bearer ${accessToken}`
            }
        })
        .then(response => response.json())
        .then(data => {
            const userId = data.id;
            const avatarHash = data.avatar;
            const username = data.username;

            // 3. 組合 Discord 頭貼的完整圖片網址
            const avatarUrl = `https://cdn.discordapp.com/avatars/${userId}/${avatarHash}.png`;

            // 4. 把右上角的登入按鈕換成使用者的「頭貼 + 名字」
            const userInfoDiv = document.getElementById('user-info');
            userInfoDiv.innerHTML = `
                <img src="${avatarUrl}" alt="頭貼" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #5865F2;">
                <span style="font-size: 14px; font-weight: bold;">${username}</span>
            `;
        })
        .catch(error => console.error('無法取得使用者資料', error));
    }
</script>
