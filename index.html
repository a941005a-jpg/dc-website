<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一個 Vercel 網站</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 100px;
            background-color: #0f172a;
            color: #f8fafc;
        }
        h1 {
            color: #38bdf8;
        }

        /* 霓虹發光按鈕樣式 */
        .btn-neon {
            background-color: rgba(139, 92, 246, 0.3); /* 紫色半透明 (數字 0.3 代表透明度) */
            color: white;                             /* 文字白色 */
            padding: 15px 32px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            display: inline-block;
            
            /* 藍色邊框 */
            border: 2px solid #38bdf8;
            
            /* 發光效果 (box-shadow) */
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6); 
            
            transition: all 0.3s ease; /* 讓滑鼠移上去時的變化更滑順 */
        }

        /* 滑鼠移上去時，發光變得更強烈、背景稍微變亮 */
        .btn-neon:hover {
            background-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.9), 0 0 10px rgba(139, 92, 246, 0.8);
        }
    </style>
</head>
<body>
    <h1>哈囉，世界！</h1>
    <p>這是我用 Vercel 成功部署的第一個網站。</p>

    <br><br>
    
    <!-- 發光按鈕 -->
    <a href="https://google.com" class="btn-neon">這是一個會發光的霓虹按鈕</a>

</body>
</html>
