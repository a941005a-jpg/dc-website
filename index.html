<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一個 Vercel 網站</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 100px;
            background-color: #0f172a;
            color: #f8fafc;
        }
        h1 {
            color: #38bdf8;
        }

        /* 共用的按鈕基礎樣式（大小、形狀、字體） */
        .btn {
            padding: 15px 32px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            display: inline-block;
            color: white;
            transition: opacity 0.3s;
            border: none;
            cursor: pointer;
        }

        /* 按鈕滑鼠移過去時微微變透明 */
        .btn:hover {
            opacity: 0.8;
        }

        /* --- 每個按鈕各自的顏色 --- */
        .btn-blue {
            background-color: #3b82f6; /* 藍色 */
        }

        .btn-green {
            background-color: #10b981; /* 綠色 */
        }

        .btn-purple {
            background-color: #8b5cf6; /* 紫色 */
        }
    </style>
</head>
<body>
    <h1>哈囉，世界！</h1>
    <p>這是我用 Vercel 成功部署的第一個網站。</p>

    <br><br>
    
    <!-- 第一個按鈕：藍色 -->
    <a href="https://google.com" class="btn btn-blue">這是一個連到 Google 的按鈕</a>

    <br><br>

    <!-- 第二個按鈕：綠色 -->
    <a href="https://github.com" class="btn btn-green">這是一個連到 GitHub 的按鈕</a>

    <br><br>

    <!-- 第三個按鈕：紫色（功能按鈕） -->
    <button class="btn btn-purple" onclick="alert('恭喜你點擊了紫色按鈕！')">
        這是一個執行功能的按鈕
    </button>

</body>
</html>
